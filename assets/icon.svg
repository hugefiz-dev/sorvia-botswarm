<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241812"/>
      <stop offset="1" stop-color="#0f0b09"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb257"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#e2450a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded dark tile (brand background) -->
  <rect x="26" y="26" width="460" height="460" rx="108" fill="url(#bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="108" fill="none" stroke="#ff7a18" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#glow)">
    <!-- antenna + hex node (brand hexagon accent) -->
    <line x1="256" y1="120" x2="256" y2="86" stroke="url(#orange)" stroke-width="10" stroke-linecap="round"/>
    <polygon points="256,52 278,64 278,88 256,100 234,88 234,64" fill="url(#orange)"/>

    <!-- bot head -->
    <rect x="140" y="122" width="232" height="196" rx="42" fill="url(#orange)"/>
    <rect x="140" y="122" width="232" height="196" rx="42" fill="#000" fill-opacity="0.12"/>

    <!-- eyes -->
    <circle cx="212" cy="212" r="26" fill="#1a0f08"/>
    <circle cx="300" cy="212" r="26" fill="#1a0f08"/>
    <circle cx="220" cy="204" r="8" fill="#ffd9a8"/>
    <circle cx="308" cy="204" r="8" fill="#ffd9a8"/>

    <!-- mouth grille -->
    <rect x="196" y="262" width="120" height="20" rx="10" fill="#1a0f08"/>
    <rect x="206" y="266" width="10" height="12" rx="3" fill="#ff7a18"/>
    <rect x="226" y="266" width="10" height="12" rx="3" fill="#ff7a18"/>
    <rect x="246" y="266" width="10" height="12" rx="3" fill="#ff7a18"/>
    <rect x="266" y="266" width="10" height="12" rx="3" fill="#ff7a18"/>
    <rect x="286" y="266" width="10" height="12" rx="3" fill="#ff7a18"/>

    <!-- side ears -->
    <rect x="116" y="196" width="22" height="52" rx="10" fill="url(#orange)"/>
    <rect x="374" y="196" width="22" height="52" rx="10" fill="url(#orange)"/>
  </g>

  <!-- hex network nodes (matches brand motif) -->
  <g fill="url(#orange)">
    <polygon points="150,372 168,382 168,402 150,412 132,402 132,382"/>
    <polygon points="200,392 216,401 216,419 200,428 184,419 184,401" opacity="0.85"/>
    <polygon points="362,372 380,382 380,402 362,412 344,402 344,382"/>
  </g>
  <line x1="168" y1="392" x2="184" y2="410" stroke="#ff7a18" stroke-width="4" stroke-opacity="0.7"/>
  <line x1="216" y1="410" x2="344" y2="392" stroke="#ff7a18" stroke-width="4" stroke-opacity="0.35"/>
</svg>
